name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-ai-dev-orchestrator' }}
  AZURE_BASE_NAME: ${{ vars.AZURE_BASE_NAME || 'ai-dev-orchestrator' }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.tags.outputs.api_image }}
      api_latest_image: ${{ steps.tags.outputs.api_latest_image }}
      web_image: ${{ steps.tags.outputs.web_image }}
      web_latest_image: ${{ steps.tags.outputs.web_latest_image }}
      worker_image: ${{ steps.tags.outputs.worker_image }}
      worker_latest_image: ${{ steps.tags.outputs.worker_latest_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          sha_tag="${GITHUB_SHA}"
          echo "api_image=ghcr.io/${owner}/ai-dev-orchestrator-api:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "api_latest_image=ghcr.io/${owner}/ai-dev-orchestrator-api:latest" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${owner}/ai-dev-orchestrator-web:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "web_latest_image=ghcr.io/${owner}/ai-dev-orchestrator-web:latest" >> "$GITHUB_OUTPUT"
          echo "worker_image=ghcr.io/${owner}/ai-dev-orchestrator-worker:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "worker_latest_image=ghcr.io/${owner}/ai-dev-orchestrator-worker:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ steps.tags.outputs.api_latest_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.worker_image }}
            ${{ steps.tags.outputs.worker_latest_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.web_image }}
            ${{ steps.tags.outputs.web_latest_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-infra:
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        shell: pwsh
        run: |
          az group create --name "${env:AZURE_RESOURCE_GROUP}" --location "${env:AZURE_LOCATION}" | Out-Null

      - name: Deploy infrastructure
        id: deploy
        shell: pwsh
        run: |
          $deployment = az deployment group create `
            --resource-group "${env:AZURE_RESOURCE_GROUP}" `
            --template-file "infra/main.bicep" `
            --parameters baseName="${env:AZURE_BASE_NAME}" `
                         authEnabled="${{ vars.ORCH_AUTH_ENABLED || 'true' }}" `
                         entraTenantId="${{ secrets.AZURE_TENANT_ID }}" `
                         entraClientId="${{ secrets.AZURE_CLIENT_ID }}" `
                         entraScope="${{ vars.ORCH_ENTRA_SCOPE || 'openid,user.read' }}" `
                         location="${env:AZURE_LOCATION}" `
                         webImage="${{ needs.build-images.outputs.web_image }}" `
                         apiImage="${{ needs.build-images.outputs.api_image }}" `
                         workerImage="${{ needs.build-images.outputs.worker_image }}" `
                         githubAppId="${{ vars.ORCH_GITHUB_APP_ID || '' }}" `
                         githubInstallationId="${{ vars.ORCH_GITHUB_INSTALLATION_ID || '' }}" `
            --output json | ConvertFrom-Json

          "key_vault_name=$($deployment.properties.outputs.keyVaultName.value)" >> $env:GITHUB_OUTPUT
          "api_url=$($deployment.properties.outputs.apiUrl.value)" >> $env:GITHUB_OUTPUT
          "web_url=$($deployment.properties.outputs.webUrl.value)" >> $env:GITHUB_OUTPUT

      - name: Seed Key Vault secrets
        shell: pwsh
        run: |
          $vaultName = "${{ steps.deploy.outputs.key_vault_name }}"

          function Set-SecretIfPresent($name, $value) {
            if (![string]::IsNullOrWhiteSpace($value)) {
              az keyvault secret set --vault-name $vaultName --name $name --value $value | Out-Null
            }
          }

          Set-SecretIfPresent "openai-api-key" "${{ secrets.OPENAI_API_KEY }}"
          Set-SecretIfPresent "anthropic-api-key" "${{ secrets.ANTHROPIC_API_KEY }}"
          Set-SecretIfPresent "azure-speech-key" "${{ secrets.AZURE_SPEECH_KEY }}"
          Set-SecretIfPresent "github-token" "${{ secrets.ORCH_GITHUB_RUNTIME_TOKEN }}"
          Set-SecretIfPresent "github-app-private-key" "${{ secrets.ORCH_GITHUB_APP_PRIVATE_KEY }}"
          Set-SecretIfPresent "github-webhook-secret" "${{ secrets.ORCH_GITHUB_WEBHOOK_SECRET }}"

      - name: Echo deployed endpoints
        shell: pwsh
        run: |
          Write-Host "Web URL: ${{ steps.deploy.outputs.web_url }}"
          Write-Host "API URL: ${{ steps.deploy.outputs.api_url }}"
